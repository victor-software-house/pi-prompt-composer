name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force a patch release (e.g. metadata-only changes)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (Biome)
        run: bun run lint:biome

      - name: Lint (oxlint)
        run: bun run lint:oxlint

      - name: Test
        run: bun run test

      - name: Commitlint
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            bunx commitlint --from ${{ github.event.before }} --to ${{ github.sha }}
          fi

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Force release commit
        if: inputs.force_release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "fix: force release"

      - name: Release
        run: bunx semantic-release
        env:
          LEFTHOOK: '0'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
