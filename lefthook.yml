output:
  - failure
  - summary

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: false
  commands:
    oxlint-fix:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs}'
      stage_fixed: true
      run: mise run hooks:oxlint-fix -- {staged_files}
    format:
      stage_fixed: true
      run: mise run hooks:format -- {staged_files}
    lint:
      run: mise run hooks:lint
    typecheck:
      run: mise run hooks:typecheck
    validate-skills:
      glob: 'skills/**'
      run: mise run skills:validate

pre-push:
  parallel: false
  commands:
    lockfile-sync:
      priority: 0
      run: mise run repo:lockfile-sync
    typecheck:
      priority: 1
      run: mise run hooks:typecheck
    lint:
      priority: 2
      run: mise run hooks:lint
    test:
      priority: 3
      run: mise run hooks:test
